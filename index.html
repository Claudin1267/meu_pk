<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cocada dos Sonhos — Rastreador</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --verde: #1a5c2a;
    --verde-claro: #2d8a42;
    --verde-bg: #e8f5eb;
    --laranja: #e85d04;
    --cinza: #f5f5f5;
    --texto: #1a1a1a;
    --sub: #666;
    --borda: #ddd;
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#fff; color:var(--texto); height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  header {
    background: var(--verde);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 100;
  }
  .header-left { display:flex; align-items:center; gap:10px; }
  .header-left h1 { font-size:17px; font-weight:700; letter-spacing:.3px; }
  .header-left p { font-size:12px; opacity:.8; margin-top:1px; }
  #gps-status { display:flex; align-items:center; gap:5px; font-size:12px; }
  #gps-dot { width:8px; height:8px; border-radius:50%; background:#ff4444; transition:background .5s; flex-shrink:0; }
  #gps-dot.ok { background:#44ff88; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  #map { flex: 1; min-height: 0; z-index: 1; }

  .tabs {
    display: flex;
    border-top: 1px solid var(--borda);
    background: #fff;
    flex-shrink: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--sub);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .2s;
  }
  .tab.active { color: var(--verde); border-bottom-color: var(--verde); }

  .panel {
    background: #fff;
    flex-shrink: 0;
    max-height: 52dvh;
    overflow-y: auto;
    border-top: 1px solid var(--borda);
  }
  .panel-section { padding: 16px; display:none; }
  .panel-section.active { display:block; }

  .tipo-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .tipo-btn {
    border: 2px solid var(--borda);
    border-radius: 12px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
    background: #fff;
  }
  .tipo-btn.sel { border-color: var(--verde); background: var(--verde-bg); }
  .tipo-btn .preco { font-size: 22px; font-weight: 800; color: var(--verde); }
  .tipo-btn .label { font-size: 12px; color: var(--sub); margin-top:2px; }

  .qty-row { display:flex; align-items:center; gap:0; margin-bottom:14px; }
  .qty-label { font-size:14px; font-weight:600; margin-right:auto; }
  .qty-total { font-size:15px; font-weight:700; color:var(--verde); margin-left:auto; }
  .qty-ctrl { display:flex; align-items:center; gap:12px; }
  .qty-btn {
    width:36px; height:36px; border-radius:50%;
    border: 2px solid var(--verde);
    background: #fff; color: var(--verde);
    font-size:20px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: all .15s;
  }
  .qty-btn:active { background: var(--verde); color:#fff; }
  .qty-num { font-size:20px; font-weight:700; min-width:28px; text-align:center; }

  .obs-input {
    width:100%; border:1.5px solid var(--borda); border-radius:10px;
    padding:10px 12px; font-size:14px; resize:none;
    font-family:inherit; margin-bottom:14px; color:var(--texto);
    outline:none; transition:border-color .2s;
  }
  .obs-input:focus { border-color: var(--verde); }

  #btn-registrar {
    width:100%; padding:15px;
    background: var(--verde); color:#fff;
    border:none; border-radius:12px;
    font-size:16px; font-weight:700;
    cursor:pointer; transition:background .15s;
  }
  #btn-registrar:active { background: var(--verde-claro); }
  #btn-registrar:disabled { background: #aaa; cursor:not-allowed; }
  #gps-hint { text-align:center; font-size:12px; color:var(--sub); margin-top:8px; }

  .resumo-cards { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
  .r-card { background:var(--verde-bg); border-radius:12px; padding:12px 8px; text-align:center; }
  .r-card .val { font-size:20px; font-weight:800; color:var(--verde); }
  .r-card .lbl { font-size:11px; color:var(--sub); margin-top:2px; }

  .vendas-lista { display:flex; flex-direction:column; gap:8px; }
  .venda-item {
    display:flex; align-items:center; gap:10px;
    background:var(--cinza); border-radius:10px; padding:10px 12px;
  }
  .venda-icon { font-size:20px; }
  .venda-info { flex:1; }
  .venda-info .vi-top { font-size:13px; font-weight:600; }
  .venda-info .vi-bot { font-size:11px; color:var(--sub); margin-top:1px; }
  .venda-val { font-size:15px; font-weight:800; color:var(--verde); }
  .venda-del { background:none; border:none; color:#cc3333; font-size:18px; cursor:pointer; padding:4px; }

  .empty-state { text-align:center; padding:30px 20px; color:var(--sub); font-size:14px; }

  #toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
    background:#1a1a1a; color:#fff; padding:12px 20px; border-radius:24px;
    font-size:14px; font-weight:500; z-index:999; transition:transform .3s ease;
    white-space:nowrap; pointer-events:none;
  }
  #toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <h1>🥥 Cocada dos Sonhos</h1>
      <p id="data-hoje"></p>
    </div>
  </div>
  <div id="gps-status">
    <div id="gps-dot"></div>
    <span id="gps-txt">Localizando...</span>
  </div>
</header>

<div id="map"></div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('registrar')">+ Registrar</div>
  <div class="tab" onclick="switchTab('resumo')">Resumo do dia</div>
</div>

<div class="panel">
  <div class="panel-section active" id="tab-registrar">
    <div class="tipo-grid">
      <div class="tipo-btn sel" id="btn-unit" onclick="setTipo('unit')">
        <div class="preco">R$10</div>
        <div class="label">Unidade</div>
      </div>
      <div class="tipo-btn" id="btn-caixa" onclick="setTipo('caixa')">
        <div class="preco">R$35</div>
        <div class="label">Caixinha (5un)</div>
      </div>
    </div>

    <div class="qty-row">
      <span class="qty-label">Quantidade</span>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <span class="qty-num" id="qty-display">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <span class="qty-total" id="total-display">Total: R$ 10,00</span>
    </div>

    <textarea class="obs-input" id="obs-input" rows="2" placeholder="Observação (opcional) — ex: cliente da Rua das Flores..."></textarea>

    <button id="btn-registrar" onclick="registrarVenda()">Registrar venda</button>
    <p id="gps-hint">Aguardando sinal GPS...</p>
  </div>

  <div class="panel-section" id="tab-resumo">
    <div class="resumo-cards">
      <div class="r-card">
        <div class="val" id="res-total">R$0</div>
        <div class="lbl">Total hoje</div>
      </div>
      <div class="r-card">
        <div class="val" id="res-unid">0</div>
        <div class="lbl">Unidades</div>
      </div>
      <div class="r-card">
        <div class="val" id="res-caixa">0</div>
        <div class="lbl">Caixinhas</div>
      </div>
    </div>
    <div class="vendas-lista" id="vendas-lista"></div>
  </div>
</div>

<div id="toast"></div>

<script>
let tipo = 'unit';
let qty = 1;
let posAtual = null;
let watchId = null;
let map, marcadorPosicao, circuloPrecisao;
const PRECOS = { unit: 10, caixa: 35 };
const STORAGE_KEY = 'cds_vendas_v2';

map = L.map('map', { zoomControl:true, attributionControl:false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(map);
map.setView([-22.88, -42.34], 14);

const iconVenda = L.divIcon({
  html: `<div style="background:#e85d04;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>`,
  className:'', iconSize:[20,20], iconAnchor:[10,10]
});
const iconPos = L.divIcon({
  html: `<div style="background:#2d8a42;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,
  className:'', iconSize:[16,16], iconAnchor:[8,8]
});

function iniciarGPS() {
  if (!navigator.geolocation) { setGPS(false, 'GPS indisponível'); return; }
  watchId = navigator.geolocation.watchPosition(
    pos => {
      posAtual = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
      setGPS(true, `±${Math.round(posAtual.acc)}m`);
      atualizarMarcadorPos();
    },
    err => setGPS(false, 'Sem sinal'),
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );
}

function setGPS(ok, txt) {
  document.getElementById('gps-dot').className = ok ? 'ok' : '';
  document.getElementById('gps-txt').textContent = txt;
  const hint = document.getElementById('gps-hint');
  hint.textContent = ok ? '📍 GPS ativo — pronto para registrar' : `⚠️ ${txt}`;
  document.getElementById('btn-registrar').disabled = false;
}

function atualizarMarcadorPos() {
  const latlng = [posAtual.lat, posAtual.lng];
  if (!marcadorPosicao) {
    marcadorPosicao = L.marker(latlng, { icon:iconPos, zIndexOffset:1000 }).addTo(map);
    circuloPrecisao = L.circle(latlng, { radius:posAtual.acc, color:'#2d8a42', fillColor:'#2d8a42', fillOpacity:.1, weight:1 }).addTo(map);
    map.setView(latlng, 16);
  } else {
    marcadorPosicao.setLatLng(latlng);
    circuloPrecisao.setLatLng(latlng).setRadius(posAtual.acc);
  }
}

function setTipo(t) {
  tipo = t;
  document.getElementById('btn-unit').className = 'tipo-btn' + (t==='unit'?' sel':'');
  document.getElementById('btn-caixa').className = 'tipo-btn' + (t==='caixa'?' sel':'');
  atualizarTotal();
}

function changeQty(d) {
  qty = Math.max(1, qty + d);
  document.getElementById('qty-display').textContent = qty;
  atualizarTotal();
}

function atualizarTotal() {
  const total = PRECOS[tipo] * qty;
  document.getElementById('total-display').textContent = `Total: R$ ${total.toFixed(2).replace('.',',')}`;
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', (i===0&&t==='registrar')||(i===1&&t==='resumo')));
  document.getElementById('tab-registrar').classList.toggle('active', t==='registrar');
  document.getElementById('tab-resumo').classList.toggle('active', t==='resumo');
  if (t==='resumo') renderResumo();
}

function getVendas() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveVendas(v) { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); }

function registrarVenda() {
  const obs = document.getElementById('obs-input').value.trim();
  const total = PRECOS[tipo] * qty;
  const agora = new Date();
  const venda = {
    id: Date.now(), tipo, qty, total, obs,
    hora: agora.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}),
    data: agora.toLocaleDateString('pt-BR'),
    lat: posAtual?.lat || null,
    lng: posAtual?.lng || null,
  };
  const vendas = getVendas();
  vendas.push(venda);
  saveVendas(vendas);

  if (venda.lat) {
    const marker = L.marker([venda.lat, venda.lng], { icon:iconVenda }).addTo(map);
    marker.bindPopup(`<b>${venda.qty}x ${venda.tipo==='unit'?'Unidade':'Caixinha'}</b><br>R$ ${venda.total},00<br>${venda.hora}${obs?'<br><i>'+obs+'</i>':''}`);
  }

  qty = 1;
  document.getElementById('qty-display').textContent = '1';
  document.getElementById('obs-input').value = '';
  atualizarTotal();
  toast(`✅ Venda registrada! R$ ${total},00`);
  renderResumo();
}

function deletarVenda(id) {
  saveVendas(getVendas().filter(v => v.id !== id));
  renderResumo();
  recarregarMarcadores();
  toast('🗑️ Venda removida');
}

function recarregarMarcadores() {
  map.eachLayer(l => { if (l instanceof L.Marker && l !== marcadorPosicao) map.removeLayer(l); });
  if (marcadorPosicao) marcadorPosicao.addTo(map);
  const hoje = new Date().toLocaleDateString('pt-BR');
  getVendas().filter(v => v.data===hoje && v.lat).forEach(v => {
    const m = L.marker([v.lat,v.lng],{icon:iconVenda}).addTo(map);
    m.bindPopup(`<b>${v.qty}x ${v.tipo==='unit'?'Unidade':'Caixinha'}</b><br>R$ ${v.total},00<br>${v.hora}${v.obs?'<br><i>'+v.obs+'</i>':''}`);
  });
}

function renderResumo() {
  const hoje = new Date().toLocaleDateString('pt-BR');
  const vendas = getVendas().filter(v => v.data === hoje);
  const totalR = vendas.reduce((s,v)=>s+v.total,0);
  const totalU = vendas.filter(v=>v.tipo==='unit').reduce((s,v)=>s+v.qty,0);
  const totalC = vendas.filter(v=>v.tipo==='caixa').reduce((s,v)=>s+v.qty,0);
  document.getElementById('res-total').textContent = `R$${totalR}`;
  document.getElementById('res-unid').textContent = totalU;
  document.getElementById('res-caixa').textContent = totalC;
  const lista = document.getElementById('vendas-lista');
  if (!vendas.length) {
    lista.innerHTML = '<div class="empty-state">Nenhuma venda hoje ainda.<br>Vai lá vender! 🥥</div>';
    return;
  }
  lista.innerHTML = [...vendas].reverse().map(v => `
    <div class="venda-item">
      <div class="venda-icon">${v.tipo==='unit'?'🥥':'📦'}</div>
      <div class="venda-info">
        <div class="vi-top">${v.qty}x ${v.tipo==='unit'?'Unidade':'Caixinha'} · ${v.hora}</div>
        <div class="vi-bot">${v.obs || (v.lat?'📍 Com localização':'Sem localização')}</div>
      </div>
      <span class="venda-val">R$${v.total}</span>
      <button class="venda-del" onclick="deletarVenda(${v.id})">✕</button>
    </div>
  `).join('');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

document.getElementById('data-hoje').textContent = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
atualizarTotal();
iniciarGPS();
recarregarMarcadores();
</script>
</body>
</html>
